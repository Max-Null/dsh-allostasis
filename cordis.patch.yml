# dsh-allostasis bundle patch: one insert over the profile root.
# `system-prompt` / `agents` / `token-meter` already live in the host (dsh-base);
# this adds only the allostasis plugin, which registers its own reminders.
#
# `config` 可覆盖四个判定阈值：driftThreshold / repetitionThreshold /
# loopWindowSteps / loopWindowHits，两个档位 silentTurn / streamCut，
# 掐断续跑的文案 streamCutResumeText，以及每 turn 的续跑次数上限 streamCutMaxResumes。
# 字段都可省略，省略即用插件内的默认值——这里刻意不写具体值，免得默认值有两个来源。
# 各字段的含义、取值范围与默认值见 README 的「配置」段。
#
# 注意 streamCut 的默认档位是 observe（只判定与留痕，不掐断）：掐断会让被掐那一步的
# usage 与 replayState 两格缺失，该轮的 token 汇总因此不可用。要开就显式写 cut。
# 开了之后 streamCutMaxResumes（默认 3）限制同一个 turn 里续跑几次；超限后掐断照旧
# 发生，停的只是续跑——没有上限时一次不收敛的退化会一直重发续跑。
# 它可以取 0，表示「只掐不续」：仍然掐断、仍然跳过空回合判定，但不往上下文里注入续跑
# 消息（steer 加消息本身是一种污染，只掐不续比 cut 保守、比 observe 有用）。
- insert:
    - id: allostasis
      name: '@max-null/dsh-allostasis'
